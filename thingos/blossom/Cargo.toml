[package]
name = "blossom"
version = "0.1.0"
edition = "2021"
description = "xdg-shell protocol layer for the bloom Wayland compositor"
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "blossom"
path = "src/main.rs"
test = false
doctest = false

[dependencies]
petals = { path = "../petals" }
stile = { path = "../stile" }
abi = { path = "../abi" }
stem = { path = "../stem", features = ["rt", "global-alloc"] }
libdl = { path = "../utils/libdl" }
