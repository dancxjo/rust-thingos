[package]
name = "bristle"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "bristle"
path = "src/main.rs"
test = false
doctest = false

[lib]
path = "src/lib.rs"

[features]
diagnostic-apps = []

[dependencies]
stem = { path = "../stem", features = ["rt", "global-alloc"] }
abi = { path = "../abi" }
