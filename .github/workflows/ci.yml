name: CI

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - main
      - trunk
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_ALIAS_XTASK: run --package xtask --

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  just-test:
    name: just test
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Cache patched vendor crates
        id: vendor-cache
        uses: actions/cache@v4
        with:
          path: |
            vendor/dirs
            vendor/dirs-sys
            vendor/errno
            vendor/mio
          key: ${{ runner.os }}-vendor-patched-${{ hashFiles('Cargo.lock') }}

      - name: Cache Rust toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
          key: ${{ runner.os }}-rustup-${{ hashFiles('rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-rustup-

      - name: Cache Cargo and build outputs
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true
          cache-on-failure: true

      - name: Cache pci.ids
        id: pciids-cache
        uses: actions/cache@v4
        with:
          path: assets/pci/pci.ids
          key: ${{ runner.os }}-pciids-v1

      - name: Bootstrap patched vendor crates
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p vendor

          crate_version() {
            local crate="$1"
            awk -v crate="$crate" '
              /^\[\[package\]\]$/ { in_pkg=1; name=""; version=""; next }
              in_pkg && /^name = / { gsub(/"/, "", $3); name=$3; next }
              in_pkg && /^version = / { gsub(/"/, "", $3); version=$3; next }
              in_pkg && name == crate && version != "" { print version; exit }
            ' Cargo.lock
          }

          fetch_crate() {
            local crate="$1"
            local version
            version="$(crate_version "$crate")"
            if [[ -z "$version" ]]; then
              echo "Failed to determine version for $crate from Cargo.lock" >&2
              exit 1
            fi
            rm -rf "vendor/$crate"
            mkdir -p "vendor/$crate"
            curl -fsSL --retry 5 --retry-all-errors "https://static.crates.io/crates/$crate/$crate-$version.crate" \
              | tar -xz --strip-components=1 -C "vendor/$crate"
          }

          fetch_crate dirs
          fetch_crate dirs-sys
          fetch_crate errno
          fetch_crate mio

      - name: Ensure pci.ids exists
        if: steps.pciids-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p assets/pci
          curl -fsSL --retry 5 --retry-all-errors \
            "https://pci-ids.ucw.cz/v2.2/pci.ids" \
            -o assets/pci/pci.ids

      - name: Install and cache QEMU packages
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: qemu-system qemu-system-misc qemu-utils
          version: 1.0

      - name: Verify QEMU binaries
        run: |
          set -euo pipefail
          command -v qemu-system-x86_64
          command -v qemu-system-aarch64
          command -v qemu-system-riscv64
          command -v qemu-system-loongarch64

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Run just test
        run: |
          cargo test \
            -p abi \
            -p abi-macros \
            -p pciids \
            -p xtask \
            -p stem-macros \
            -p llm \
            -p llm_stub \
            -p fb_common \
            -p kindc
          cargo test -p stem --features simd --no-run

  just-behave:
    name: just behave
    runs-on: ubuntu-latest
    permissions:
      contents: write
    continue-on-error: true
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Cache patched vendor crates
        id: vendor-cache
        uses: actions/cache@v4
        with:
          path: |
            vendor/dirs
            vendor/dirs-sys
            vendor/errno
            vendor/mio
          key: ${{ runner.os }}-vendor-patched-${{ hashFiles('Cargo.lock') }}

      - name: Cache Rust toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
          key: ${{ runner.os }}-rustup-${{ hashFiles('rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-rustup-

      - name: Cache Cargo and build outputs
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true
          cache-on-failure: true

      - name: Cache pci.ids
        id: pciids-cache
        uses: actions/cache@v4
        with:
          path: assets/pci/pci.ids
          key: ${{ runner.os }}-pciids-v1

      - name: Bootstrap patched vendor crates
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p vendor

          crate_version() {
            local crate="$1"
            awk -v crate="$crate" '
              /^\[\[package\]\]$/ { in_pkg=1; name=""; version=""; next }
              in_pkg && /^name = / { gsub(/"/, "", $3); name=$3; next }
              in_pkg && /^version = / { gsub(/"/, "", $3); version=$3; next }
              in_pkg && name == crate && version != "" { print version; exit }
            ' Cargo.lock
          }

          fetch_crate() {
            local crate="$1"
            local version
            version="$(crate_version "$crate")"
            if [[ -z "$version" ]]; then
              echo "Failed to determine version for $crate from Cargo.lock" >&2
              exit 1
            fi
            rm -rf "vendor/$crate"
            mkdir -p "vendor/$crate"
            curl -fsSL --retry 5 --retry-all-errors "https://static.crates.io/crates/$crate/$crate-$version.crate" \
              | tar -xz --strip-components=1 -C "vendor/$crate"
          }

          fetch_crate dirs
          fetch_crate dirs-sys
          fetch_crate errno
          fetch_crate mio

      - name: Ensure pci.ids exists
        if: steps.pciids-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p assets/pci
          curl -fsSL --retry 5 --retry-all-errors \
            "https://pci-ids.ucw.cz/v2.2/pci.ids" \
            -o assets/pci/pci.ids

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Run just behave
        run: just behave

      - name: Commit updated behavior artifacts
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]' }}
        run: |
          set -euo pipefail

          if git diff --quiet -- docs/behavior; then
            echo "No docs/behavior changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/behavior
          if git diff --cached --quiet; then
            echo "No staged docs/behavior changes to commit."
            exit 0
          fi

          git commit -m "ci: update behavior artifacts"
          git push origin "HEAD:${{ github.head_ref }}"

      - name: Upload BDD behavior reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bdd-behavior-readmes
          path: docs/behavior
          if-no-files-found: warn
          retention-days: 7

      - name: Upload BDD ISO images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bdd-iso-images
          path: target/bdd/images/*.iso
          if-no-files-found: warn
          retention-days: 7
