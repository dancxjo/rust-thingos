name: CI

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - main
      - trunk
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  just-test:
    name: just test
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Cache patched vendor crates
        id: vendor-cache
        uses: actions/cache@v4
        with:
          path: |
            vendor/dirs
            vendor/dirs-sys
            vendor/errno
            vendor/mio
          key: ${{ runner.os }}-vendor-patched-${{ hashFiles('Cargo.lock') }}

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/git/checkouts
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache pci.ids
        id: pciids-cache
        uses: actions/cache@v4
        with:
          path: assets/pci/pci.ids
          key: ${{ runner.os }}-pciids-v1

      - name: Bootstrap patched vendor crates
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p vendor

          crate_version() {
            local crate="$1"
            awk -v crate="$crate" '
              /^\[\[package\]\]$/ { in_pkg=1; name=""; version=""; next }
              in_pkg && /^name = / { gsub(/"/, "", $3); name=$3; next }
              in_pkg && /^version = / { gsub(/"/, "", $3); version=$3; next }
              in_pkg && name == crate && version != "" { print version; exit }
            ' Cargo.lock
          }

          fetch_crate() {
            local crate="$1"
            local version
            version="$(crate_version "$crate")"
            if [[ -z "$version" ]]; then
              echo "Failed to determine version for $crate from Cargo.lock" >&2
              exit 1
            fi
            rm -rf "vendor/$crate"
            mkdir -p "vendor/$crate"
            curl -fsSL --retry 5 --retry-all-errors "https://static.crates.io/crates/$crate/$crate-$version.crate" \
              | tar -xz --strip-components=1 -C "vendor/$crate"
          }

          fetch_crate dirs
          fetch_crate dirs-sys
          fetch_crate errno
          fetch_crate mio

      - name: Ensure pci.ids exists
        if: steps.pciids-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p assets/pci
          curl -fsSL --retry 5 --retry-all-errors \
            "https://pci-ids.ucw.cz/v2.2/pci.ids" \
            -o assets/pci/pci.ids

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Run just test
        run: just test

  just-behave:
    name: just behave
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Cache patched vendor crates
        id: vendor-cache
        uses: actions/cache@v4
        with:
          path: |
            vendor/dirs
            vendor/dirs-sys
            vendor/errno
            vendor/mio
          key: ${{ runner.os }}-vendor-patched-${{ hashFiles('Cargo.lock') }}

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/git/checkouts
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache pci.ids
        id: pciids-cache
        uses: actions/cache@v4
        with:
          path: assets/pci/pci.ids
          key: ${{ runner.os }}-pciids-v1

      - name: Bootstrap patched vendor crates
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p vendor

          crate_version() {
            local crate="$1"
            awk -v crate="$crate" '
              /^\[\[package\]\]$/ { in_pkg=1; name=""; version=""; next }
              in_pkg && /^name = / { gsub(/"/, "", $3); name=$3; next }
              in_pkg && /^version = / { gsub(/"/, "", $3); version=$3; next }
              in_pkg && name == crate && version != "" { print version; exit }
            ' Cargo.lock
          }

          fetch_crate() {
            local crate="$1"
            local version
            version="$(crate_version "$crate")"
            if [[ -z "$version" ]]; then
              echo "Failed to determine version for $crate from Cargo.lock" >&2
              exit 1
            fi
            rm -rf "vendor/$crate"
            mkdir -p "vendor/$crate"
            curl -fsSL --retry 5 --retry-all-errors "https://static.crates.io/crates/$crate/$crate-$version.crate" \
              | tar -xz --strip-components=1 -C "vendor/$crate"
          }

          fetch_crate dirs
          fetch_crate dirs-sys
          fetch_crate errno
          fetch_crate mio

      - name: Ensure pci.ids exists
        if: steps.pciids-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p assets/pci
          curl -fsSL --retry 5 --retry-all-errors \
            "https://pci-ids.ucw.cz/v2.2/pci.ids" \
            -o assets/pci/pci.ids

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Run just behave
        run: just behave
